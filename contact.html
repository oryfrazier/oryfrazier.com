<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Ory Frazier</title>
<meta name="description" content="Questions about coaching, or just want to chat about your growth journey? Reach out to Ory Frazier.">
<link rel="canonical" href="https://www.oryfrazier.com/contact">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact — Ory Frazier">
<meta property="og:description" content="Questions about coaching, or just want to chat about your growth journey? Reach out to Ory Frazier.">
<meta property="og:url" content="https://www.oryfrazier.com/contact">
<meta property="og:image" content="https://www.oryfrazier.com/assets/img/contact-summit-1500.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/fredoka-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/nunito-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css?v=3">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="site-title" href="/">Ory Frazier</a>
  <nav class="site-nav" aria-label="Main">
    <a href="/about">About</a>
    <a href="/coaching">Coaching</a>
    <a href="/projects">Projects</a>
    <a href="/contact" aria-current="page">Contact</a>
  </nav>
</header>

<main id="main">

  <section class="section">
    <div class="section__inner split split--form-image">
      <h1 class="split__title">Let’s reach new heights together!</h1>
      <div class="split__body stack">
        <p>If you have questions or just want to chat about your growth journey, don't hesitate to reach out! I’m here to support you every step of the way.</p>

        <form class="form js-form" action="/api/contact" method="POST">
          <input type="hidden" name="_source" value="contact">
          <div class="form__gotcha" aria-hidden="true">
            <label for="contact-gotcha">Leave this field empty</label>
            <input id="contact-gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
          </div>

          <div class="form__field">
            <label for="contact-name">Name</label>
            <input id="contact-name" type="text" name="name" autocomplete="name" required>
          </div>

          <div class="form__field">
            <label for="contact-pronouns">Pronouns</label>
            <input id="contact-pronouns" type="text" name="pronouns" required>
          </div>

          <div class="form__field">
            <label for="contact-email">Email</label>
            <input id="contact-email" type="email" name="email" autocomplete="email" required>
          </div>

          <div class="form__field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="6" required></textarea>
          </div>

          <div class="form__actions">
            <button class="button" type="submit">Connect</button>
          </div>

          <p class="form__status js-form-status" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div class="split__media">
        <img src="/assets/img/contact-summit-1500.webp"
             srcset="/assets/img/contact-summit-750.webp 750w,
                     /assets/img/contact-summit-1500.webp 1500w,
                     /assets/img/contact-summit-2500.webp 2500w"
             sizes="(max-width: 767px) 88vw, 45vw"
             alt="Ory Frazier on a snowy summit" width="2500" height="3333" loading="lazy">
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <a href="https://www.linkedin.com/in/ory-frazier/" target="_blank" rel="noopener">Linkedin</a>
    <a href="https://www.instagram.com/oryfrazier" target="_blank" rel="noopener">Instagram</a>
  </div>
</footer>

<script src="/assets/js/form.js?v=3" defer></script>
</body>
</html>
